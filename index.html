<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Randomizer</title>
    <link rel="stylesheet" href="style.css" />
    <script>
        // Load the tracks asynchronously
        window.tracks = null;
        const data = fetch("data.json")
            .then((response) => response.json())
            .then((data) => {
                window.tracks = data;
            });
    </script>
</head>

<body>
    <div>
        <div class="settings-panel">
            <header>
                <h1>Mario Kart Randomizer</h1>
            </header>
            <h1>Settings</h1>
            <div>
                <h2>Tracks from: </h2>
                <input type="checkbox" id="base" />
                <label for="base">Base Game</label>
                <input type="checkbox" id="deluxe" />
                <label for="deluxe">Deluxe Edition</label>
                <input type="checkbox" id="ctgp" />
                <label for="ctgp">CTGP</label>
            </div>
            <div>
                <h2>Miscellaneous</h2>
                <input type="checkbox" id="tour" />
                <label for="tour">Enable Tours</label>
                <input type="checkbox" id="wii" />
                <label for="wii">Only Wii Tracks</label>
            </div>
            <div class="button-row">
                <button id="randomize">Randomize!</button>
                <button id="reset">Reset Shuffle</button>
            </div>
        </div>
        <div class="track-panel"></div>
    </div>

    <footer class="disclaimer">
        Mario Kart™ and all related trademarks are property of Nintendo. This is an unofficial fan project made for fun,
        with no intent to infringe on copyright.
    </footer>

    <script src="main.js"></script>
</body>

</html>
